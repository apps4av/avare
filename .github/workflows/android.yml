name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Set app version
      run: |
        echo "APP_VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/src/main/AndroidManifest.xml)" >> "$GITHUB_ENV"
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Replace NMS FAA
      uses: richardrigutins/replace-in-files@v2
      with:
        files: '**/*.java'
        search-text: '@@__faa_nms_api_client_id_secret__@@'
        replacement-text: ${{ secrets.FAA_NMS_API_CLIENT_ID_SECRET }}
        encoding: 'utf8'
        max-parallelism: 10

    - name: Find and Replace RC Key
      uses: richardrigutins/replace-in-files@v2
      with:
        files: '**/*.java'
        search-text: '@@___revenuecat_android_api_key__@@'
        replacement-text: ${{ secrets.ANDROID_REVENUECAT_API_KEY }}
        encoding: 'utf8'
        max-parallelism: 10
        
    - name: Create Google Services JSON File
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: rm -f app/google-services.json && (echo $GOOGLE_SERVICES_JSON | base64 -di > app/google-services.json)

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Sign APK with keystore
      uses: r0adkll/sign-android-release@v1
      id: sign_apk
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEY_STORE }}
        alias: ${{ secrets.KEY_STORE_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASS }}
        keyPassword: ${{ secrets.KEY_STORE_PASS }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Build AAB
      run: ./gradlew bundleRelease

    - name: Sign AAB with keystore
      uses: r0adkll/sign-android-release@v1
      id: sign_aab
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.KEY_STORE }}
        alias: ${{ secrets.KEY_STORE_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASS }}
        keyPassword: ${{ secrets.KEY_STORE_PASS }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Prepare upload artifacts
      run: |
        mkdir -p build/artifacts
        cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" "build/artifacts/avare_${APP_VERSION}.apk"
        cp "${{ steps.sign_aab.outputs.signedReleaseFile }}" "build/artifacts/avare_${APP_VERSION}.aab"

    - name: Upload release
      uses: appleboy/scp-action@v0.1.7
      with:
        host: apps4av.org
        username: apps4av
        password: ${{ secrets.MAMBA_PASSWORD }}
        port: 22
        strip_components: 2
        source: build/artifacts/*
        target: /home/apps4av/builds

    - name: Update Play whatsnew from help
      run: bash .github/scripts/update-whatsnew.sh

    - name: Decide store publish
      id: store
      env:
        PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      run: bash .github/scripts/should-publish-store.sh

    - name: Upload to Google Play
      if: steps.store.outputs.publish == 'true'
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        packageName: com.ds.avare
        releaseFiles: build/artifacts/avare_${{ env.APP_VERSION }}.aab
        track: internal
        status: completed
        whatsNewDirectory: store/whatsnew
